name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# VectixDB is a private repository: VECTIXDB_TOKEN is a fine-grained token
# with read access to raucheacho/vectixdb contents.
jobs:
  test-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: lorag
      - uses: actions/checkout@v4
        with:
          repository: raucheacho/vectixdb
          token: ${{ secrets.VECTIXDB_TOKEN }}
          path: vectixdb
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: actions/setup-go@v5
        with:
          go-version-file: lorag/go.mod
          cache-dependency-path: lorag/go.sum

      - name: Build the VectixDB library
        run: ./vectixdb/scripts/go-libs.sh
      - name: Placeholder UI (the server embeds ui/dist)
        run: mkdir -p lorag/ui/dist && touch lorag/ui/dist/index.html
      - run: go vet ./...
        working-directory: lorag
      - run: go test -race ./...
        working-directory: lorag

  test-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run build

  build-docker:
    runs-on: ubuntu-latest
    needs: [test-go, test-ui]
    steps:
      - uses: actions/checkout@v4
        with:
          path: lorag
      - uses: actions/checkout@v4
        with:
          repository: raucheacho/vectixdb
          token: ${{ secrets.VECTIXDB_TOKEN }}
          path: vectixdb
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: lorag
          build-contexts: vectixdb=vectixdb
          push: false
          tags: lorag:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# VectixDB is a private Go module: VECTIXDB_TOKEN is a fine-grained token
# with read access to raucheacho/vectixdb contents.
env:
  GOPRIVATE: github.com/raucheacho/*

jobs:
  test-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Access to the VectixDB module
        env:
          TOKEN: ${{ secrets.VECTIXDB_TOKEN }}
        run: git config --global url."https://x-access-token:$TOKEN@github.com/raucheacho/".insteadOf "https://github.com/raucheacho/"
      - name: Placeholder UI (the server embeds ui/dist)
        run: mkdir -p ui/dist && touch ui/dist/index.html
      - run: go vet ./...
      - run: go test -race ./...

  test-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run build

  build-docker:
    runs-on: ubuntu-latest
    needs: [test-go, test-ui]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          secrets: github_token=${{ secrets.VECTIXDB_TOKEN }}
          push: false
          tags: lorag:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

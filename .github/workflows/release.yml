name: Release

# Pushing a tag v<version> builds the archives, drafts the GitHub release
# (archives, SHA256SUMS, Homebrew formula) and pushes the Docker image.
# Publish the draft by hand after checking it.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

# VectixDB is a private Go module: VECTIXDB_TOKEN is a fine-grained token
# with read access to raucheacho/vectixdb contents.
env:
  GOPRIVATE: github.com/raucheacho/*

jobs:
  build:
    strategy:
      matrix:
        include:
          # macOS binaries link Apple frameworks: built on macOS.
          - os: macos-latest
            platforms: darwin_arm64 darwin_amd64
            smoke: darwin_arm64
          # Linux binaries are cross-built with zig cc against glibc 2.28.
          - os: ubuntu-latest
            platforms: linux_amd64 linux_arm64
            smoke: linux_amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # zig cc: the C compiler for the Linux cross builds.
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Access to the VectixDB module
        env:
          TOKEN: ${{ secrets.VECTIXDB_TOKEN }}
        run: git config --global url."https://x-access-token:$TOKEN@github.com/raucheacho/".insteadOf "https://github.com/raucheacho/"

      - name: Build the Studio
        working-directory: ui
        run: npm ci && npm run build
      - name: Build the archives
        run: ./scripts/dist.sh "$GITHUB_REF_NAME" ${{ matrix.platforms }}
      - name: Check the native binary
        working-directory: dist
        run: |
          name="lorag_${GITHUB_REF_NAME#v}_${{ matrix.smoke }}"
          tar -xzf "$name.tar.gz"
          "$name/lorag" version | grep -F "${GITHUB_REF_NAME#v}"
          "$name/loragctl" version | grep -F "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: archives-${{ matrix.os }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: archives-*
          path: dist
          merge-multiple: true
      - name: Checksums and Homebrew formula
        run: |
          (cd dist && sha256sum lorag_*.tar.gz > SHA256SUMS && cat SHA256SUMS)
          LORAG_REPO="$GITHUB_REPOSITORY" ./scripts/homebrew.sh "$GITHUB_REF_NAME" dist/SHA256SUMS > dist/lorag.rb
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=
          case "$GITHUB_REF_NAME" in *-*) prerelease=--prerelease ;; esac
          gh release create "$GITHUB_REF_NAME" --draft --generate-notes $prerelease \
            dist/*.tar.gz dist/SHA256SUMS dist/lorag.rb

  docker:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      # amd64 only for now (arm64: see docs/STATUS.md).
      - uses: docker/build-push-action@v6
        with:
          context: .
          secrets: github_token=${{ secrets.VECTIXDB_TOKEN }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

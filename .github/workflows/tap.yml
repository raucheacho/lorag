name: Tap

# When a release is published, copies its Homebrew formula (lorag.rb) to
# raucheacho/homebrew-tap. HOMEBREW_TAP_TOKEN is a fine-grained token with
# write access to the contents of raucheacho/homebrew-tap.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, e.g. v0.1.0
        required: true

permissions:
  contents: read

jobs:
  formula:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Download the formula
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p lorag.rb
      - uses: actions/checkout@v4
        with:
          repository: raucheacho/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Push it to the tap
        run: |
          cp lorag.rb tap/Formula/lorag.rb
          cd tap
          git add Formula/lorag.rb
          if git diff --cached --quiet; then echo "formula unchanged"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "lorag ${TAG#v}"
          git push
